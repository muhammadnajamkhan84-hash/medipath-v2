<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to MediPath to get a personalized hospital navigation experience.">
  <meta name="theme-color" content="#0d6efd">
  <title>MediPath — Login</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d6efd'/%3E%3Cpath d='M38 50h24M50 38v24' stroke='white' stroke-width='11' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <div class="logo">Medi<span>Path</span></div>
      <h1>Welcome back</h1>
      <p class="login-sub">Log in with your registered email or phone number to continue.</p>

      <form class="appt-form" id="loginForm">
        <p class="login-error" id="loginError" role="alert"></p>

        <label for="loginName">Full Name</label>
        <input type="text" id="loginName" placeholder="e.g. Ali Raza" autocomplete="name" required>

        <label for="loginId">Email or Phone Number</label>
        <input type="text" id="loginId" placeholder="e.g. ali@example.com or 03001234567" autocomplete="username" required>

        <label for="loginPassword">Password</label>
        <div class="password-wrap">
          <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password" title="Show password">👁️</button>
        </div>

        <label for="loginRole">I am here as...</label>
        <select id="loginRole" required>
          <option value="" disabled selected>Choose one</option>
          <option value="visitor">Visitor</option>
          <option value="checkup">Regular Checkup</option>
          <option value="patient">Patient</option>
        </select>

        <button type="submit">Log In</button>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
